name: Trigger Detective

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Print Event Name
        run: |
          echo "Triggered by event: ${{ github.event_name }}"

      - name: Print Branch on Push
        if: github.event_name == 'push'
        run: |
          echo "Pushed to branch: ${{ github.ref_name }}"

      - name: Print Source and Target Branches on Pull Request
        if: github.event_name == 'pull_request'
        run: |
          echo "Source Branch (Head): ${{ github.head_ref }}"
          echo "Target Branch (Base): ${{ github.base_ref }}"

      - name: Finish Message
        run: echo "Detective work complete"