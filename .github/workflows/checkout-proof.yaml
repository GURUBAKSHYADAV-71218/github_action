name: Checkout Proof

on:
  push:
  workflow_dispatch:

jobs:
    prove:
      runs-on: ubuntu-latest
      steps:
        - name: Print initial folder and contents
          run: |
            pwd
            ls -la

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: List contents and count files
          run: |
            ls -la
            echo "Total files/folders present:"
            find . -maxdepth 1 | wc -l

        - name: Finish proof
          run: echo "Proof captured"