name: Building Blocks
on: workflow_dispatch

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: say hello
              run: echo "Hello, World!"
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: failed steps
              run: echo "this step will fail" && exit 1
            - name: say goodbye
              run: echo "Goodbye, World!"


   